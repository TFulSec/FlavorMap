<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết - Thổ Địa Ẩm Thực</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/main.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      .restaurant-banner { position: relative; height: 420px; overflow: hidden; border-radius: var(--radius-2xl); margin-top: var(--space-4); box-shadow: var(--shadow-md); background: #0F172A; }
      .restaurant-banner img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; transition: transform 0.8s; }
      .restaurant-banner:hover img { transform: scale(1.02); }
      .banner-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(15, 23, 42, 0.9) 0%, rgba(15, 23, 42, 0.4) 60%, transparent 100%); padding: var(--space-8); color: #fff; display: flex; flex-direction: column; gap: var(--space-2); }
      .banner-overlay h1 { font-family: var(--font-display); font-size: var(--font-size-3xl); font-weight: 850; margin-bottom: 4px; letter-spacing: -0.02em; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
      .detail-layout { display: grid; grid-template-columns: 360px 1fr; gap: var(--space-8); padding: var(--space-10) 0; }
      .info-card { background: var(--color-bg-soft); border: 1px solid rgba(255, 90, 31, 0.08); border-radius: var(--radius-xl); padding: var(--space-6); position: sticky; top: 100px; box-shadow: var(--shadow-md); }
      .info-card p { display: flex; align-items: flex-start; gap: var(--space-3); margin-bottom: var(--space-4); font-size: var(--font-size-base); color: var(--color-text); font-weight: 550; }
      .info-card strong { color: var(--color-secondary); }
      .action-btns { display: flex; flex-direction: column; gap: var(--space-3); margin-top: var(--space-6); }
      .menu-item { display: flex; gap: var(--space-5); padding: var(--space-5); border: 1px solid rgba(255, 90, 31, 0.08); border-radius: var(--radius-xl); margin-bottom: var(--space-4); background: var(--color-bg-soft); box-shadow: var(--shadow-sm); transition: all var(--transition); }
      .menu-item:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: rgba(255, 90, 31, 0.15); }
      .menu-item.unavailable { opacity: 0.55; }
      .menu-item img { width: 110px; height: 110px; object-fit: cover; border-radius: var(--radius-lg); background: #eee; box-shadow: var(--shadow-sm); }
      .menu-item__info { flex: 1; display: flex; flex-direction: column; gap: 4px; }
      .menu-item__info h4 { font-family: var(--font-display); font-weight: 800; font-size: 1.1rem; color: var(--color-secondary); }
      .menu-item__info p  { font-size: var(--font-size-sm); color: var(--color-text-light); line-height: 1.4; }
      .menu-item__price { display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 6px; }
      .menu-item__price strong { color: var(--color-primary); font-size: var(--font-size-lg); font-weight: 800; letter-spacing: -0.01em; }
      .breadcrumb { padding: var(--space-6) 0 var(--space-2) 0; font-size: var(--font-size-sm); color: var(--color-text-light); font-weight: 550; }
      .breadcrumb a { color: var(--color-text-light); text-decoration: none; transition: color var(--transition); }
      .breadcrumb a:hover { color: var(--color-primary); }
      
      .detail-menu h2, .review-section h2, .map-section h2 { font-family: var(--font-display); font-size: var(--font-size-xl); font-weight: 850; color: var(--color-secondary); margin-bottom: var(--space-6); position: relative; padding-bottom: 8px; border-bottom: 2px solid var(--color-primary-light); }
      
      @media (max-width: 768px) {
        .detail-layout { grid-template-columns: 1fr; padding: var(--space-6) 0; }
        .restaurant-banner { height: 280px; border-radius: var(--radius-xl); }
        .banner-overlay { padding: var(--space-5); }
        .banner-overlay h1 { font-size: var(--font-size-xl); }
      }
    </style>
</head>
<body>
    <div id="navbar-placeholder"></div>

    <!-- Container content -->
    <div id="detail-container">
       <div class="container" style="text-align:center; padding: 100px 0;">
           <h2>Đang tải dữ liệu...</h2>
       </div>
    </div>
<script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/utils.js"></script>
    <script src="/assets/js/components/toast.js"></script>
    <script src="/assets/js/bookmarks.js"></script>
    <script src="/assets/js/components/starRating.js"></script>
    <script src="/assets/js/components/reviewList.js"></script>
    <script src="/assets/js/components/navbar.js"></script>
<script>
      let currentReviewPage = 1;

      document.addEventListener('DOMContentLoaded', async () => {
        navbar.render();
        const slug = utils.getParam('slug');
        if(!slug) {
            document.getElementById('detail-container').innerHTML = '<div class="container" style="padding:100px 0;"><h2>Không tìm thấy trang.</h2></div>';
            return;
        }

        try {
            const res = await api.get('/restaurants/' + slug);
            const r = res.data;
            document.title = `${r.Name} - Thổ Địa Ẩm Thực`;

            const isOpen = utils.isOpen(r.OpeningTime, r.ClosingTime);
            const statusBadge = r.IsTemporarilyClosed
              ? `<span class="badge badge--closed">Tạm đóng</span>`
              : (isOpen === null ? '' : `<span class="badge badge--${isOpen ? 'open' : 'closed'}">${isOpen ? 'Đang mở' : 'Đã đóng'}</span>`);

            const crowdLabel = ({ quiet: '🟢 Vắng', moderate: '🟡 Vừa', crowded: '🔴 Đông' })[r.CrowdStatus] || '🟡 Vừa';
            const verifiedBadge = r.VerificationStatus === 'Verified'
              ? '<span class="badge" style="background:#ecfdf5;color:#047857;margin-left:8px">✓ Đã xác minh</span>'
              : '';
            const verifiedText = r.VerificationStatus === 'Verified'
              ? `<p style="color:#047857;font-weight:800">✓ Thông tin đã xác minh${r.LastVerifiedAtUtc ? ` · ${new Date(r.LastVerifiedAtUtc).toLocaleDateString('vi-VN')}` : ''}</p>`
              : '';
            const crowdFreshness = r.CrowdIsStale ? ' (đã tự đặt về Vừa vì quá 2 giờ)' : '';

            const hoursHtml = (r.openingHours || []).length
              ? `<div style="margin-top:14px;"><strong>Giờ mở cửa theo tuần</strong>${r.openingHours.map(h => `<div style="display:flex;justify-content:space-between;gap:14px;margin-top:5px;"><span>${['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'][h.DayOfWeek]}</span><span>${h.IsClosed ? 'Nghỉ' : `${h.OpeningTime || '--:--'} – ${h.ClosingTime || '--:--'}`}</span></div>`).join('')}</div>`
              : '';
            const contactHtml = [
              r.Phone ? `<p>📞 <a href="tel:${r.Phone}">${r.Phone}</a></p>` : '',
              r.ZaloPhone ? `<p>💬 Zalo: ${r.ZaloPhone}</p>` : '',
              r.WebsiteUrl ? `<p>🌐 <a href="${r.WebsiteUrl}" target="_blank" rel="noopener">Website</a></p>` : '',
              r.FacebookUrl ? `<p>📘 <a href="${r.FacebookUrl}" target="_blank" rel="noopener">Facebook</a></p>` : '',
            ].join('');
            const temporaryNotice = r.IsTemporarilyClosed
              ? `<div style="margin:14px 0;padding:12px;background:#fff1f2;border:1px solid #fecdd3;border-radius:10px;color:#9f1239;"><strong>Quán đang tạm đóng</strong><br>${r.TemporaryCloseReason || 'Chưa có lý do'}${r.TemporaryClosedUntilUtc ? `<br>Dự kiến mở lại: ${new Date(r.TemporaryClosedUntilUtc).toLocaleString('vi-VN')}` : ''}</div>`
              : (r.OperatingNote ? `<div style="margin:14px 0;padding:12px;background:#ecfdf5;border-radius:10px;">${r.OperatingNote}</div>` : '');

            const menuHtml = (r.menuItems || []).map(m => `
                <div class="menu-item ${m.IsAvailable ? '' : 'unavailable'}" data-name="${utils.escapeHtml(m.Name || '')}" data-category="${utils.escapeHtml(m.MenuCategoryName || '')}">
                  <img src="${utils.escapeHtml(m.ImageUrl || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c4?auto=format&fit=crop&w=300&q=80')}" alt="${utils.escapeHtml(m.Name || 'Món ăn')}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c4?auto=format&fit=crop&w=300&q=80'">
                  <div class="menu-item__info">
                    <h4>${utils.escapeHtml(m.Name || 'Món ăn')}${m.IsFeatured ? ' ⭐' : ''}</h4>
                    <p>${m.MenuCategoryName ? `<strong>${utils.escapeHtml(m.MenuCategoryName)}</strong> · ` : ''}${utils.escapeHtml(m.Description || '')}</p>
                  </div>
                  <div class="menu-item__price">
                    ${!m.IsAvailable ? '<span class="badge badge--sold-out">Hết hàng</span>' : ''}
                    ${m.DiscountPrice !== null && m.DiscountPrice !== undefined ? `<small style="text-decoration:line-through;display:block;">${utils.formatPrice(m.Price)}</small><strong>${utils.formatPrice(m.DiscountPrice)}</strong>` : `<strong>${utils.formatPrice(m.Price)}</strong>`}
                  </div>
                </div>
            `).join('') || '<p style="color:var(--color-text-light);">Chưa có thực đơn.</p>';

            const html = `
              <div class="container">
                <nav class="breadcrumb">
                  <a href="/pages/index.html">Trang chủ</a> > 
                  <a href="/pages/search.html?category=${encodeURIComponent(r.Category)}">${utils.escapeHtml(utils.categoryLabel(r.Category))}</a> > 
                  ${utils.escapeHtml(r.Name)}
                </nav>
              </div>

              <div class="restaurant-banner">
                <img src="${r.BannerUrl || 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80'}" alt="${r.Name}" onerror="this.src='https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1200&q=80'">
                <div class="banner-overlay container">
                  <h1>${r.Name}</h1>
                  <span class="badge badge--featured" style="background:#FEF3C7; color:#92400E; margin-right:8px;">${utils.escapeHtml(utils.categoryLabel(r.Category))}</span>
                  ${statusBadge}
                  <span class="badge" style="margin-left:8px;">${crowdLabel}</span>
                  ${verifiedBadge}
                </div>
              </div>

              <div class="container detail-layout" id="overview">
                <div class="detail-info">
                  <div class="info-card">
                    <p>📍 <strong>${r.Address}</strong></p>
                    <p>🕐 ${r.OpeningTime ? r.OpeningTime.slice(0,5) : '--:--'} – ${r.ClosingTime ? r.ClosingTime.slice(0,5) : '--:--'}</p>
                    <p>💰 ${utils.formatPriceRange(r.PriceMin, r.PriceMax)}</p>
                    <p>⭐ ${utils.renderStars(r.Rating || 0)}</p>
                    <p>👥 <strong>${crowdLabel}</strong>${crowdFreshness}</p>
                    ${verifiedText}
                    ${temporaryNotice}
                    ${contactHtml}
                    ${hoursHtml}
                    <div style="margin-top:20px;">
                        <p style="color:var(--color-text-light); text-align:justify;">${r.Description || 'Chưa có mô tả.'}</p>
                    </div>
                    <div class="action-btns">
                      <a href="https://maps.google.com/?q=${r.Latitude || 0},${r.Longitude || 0}"
                         target="_blank" class="btn btn--primary" style="justify-content:center;">🗺️ Xem trên bản đồ</a>
                      <button onclick="shareRestaurant()" class="btn btn--outline" style="justify-content:center;">📤 Chia sẻ</button>
                      ${!r.HasOwner ? `<a href="/pages/submit-restaurant.html?claimSlug=${encodeURIComponent(r.Slug)}" class="btn btn--outline" style="justify-content:center;">Đây là quán của tôi</a>` : ''}
                    </div>
                  </div>
                </div>

                <div class="detail-menu">
                  <section id="menu-section">
                  <h2 style="font-size:var(--font-size-2xl); font-weight:800; margin-bottom:var(--space-6);">🍽 Thực đơn</h2>
                  <div class="menu-list" id="menu-list">
                    ${menuHtml}
                  </div>
                  </section>

                  <div class="review-section" id="reviews-section">
                    <h2>⭐ Đánh giá & Bình luận</h2>
                    <div id="rating-summary"></div>
                    <div id="review-form-wrap"></div>
                    <div id="review-list" class="review-list"></div>
                    <div id="review-pagination" class="pagination" style="display:none; justify-content:flex-start; margin-top:var(--space-4);">
                       <button class="page-btn" id="revPrevPage">Trước</button>
                       <span id="revPageInfo" style="font-weight:600; font-size:14px; margin: 0 var(--space-4);"></span>
                       <button class="page-btn" id="revNextPage">Tiếp</button>
                    </div>
                  </div>

                  <div class="map-section" id="map-section">
                    <h2>🗺️ Vị trí trên bản đồ</h2>
                    <div id="restaurant-map" class="map-container"></div>
                  </div>
                </div>
              </div>
            `;
            document.getElementById('detail-container').innerHTML = html;
            
            initRestaurantMap(r);
            loadReviews(slug, 1);
        } catch(e) {
            document.getElementById('detail-container').innerHTML = `<div class="container" style="padding:100px 0;"><h2>Lỗi: ${e.message}</h2></div>`;
        }
      });

      function openReviewReportDialog(slug, reviewId) {
          if (!auth.isLoggedIn()) {
              window.location.href = `/pages/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}`;
              return;
          }
          document.getElementById('reviewReportOverlay')?.remove();
          const overlay = document.createElement('div');
          overlay.id = 'reviewReportOverlay';
          overlay.className = 'modal-overlay';
          overlay.style.display = 'flex';
          overlay.innerHTML = `
            <div class="modal-card" style="width:480px;max-width:92%;">
              <h3>Báo cáo đánh giá vi phạm</h3>
              <p class="text-muted" style="margin-bottom:16px;">Chỉ báo cáo nội dung spam, xúc phạm, giả mạo, xung đột lợi ích hoặc thông tin sai. Không báo cáo chỉ vì bạn không đồng ý với số sao.</p>
              <div class="form-group">
                <label class="form-label" for="reviewReportReason">Lý do</label>
                <select id="reviewReportReason" class="form-input">
                  <option value="Spam">Spam hoặc quảng cáo</option>
                  <option value="Offensive">Xúc phạm hoặc ngôn từ thù ghét</option>
                  <option value="FalseInformation">Thông tin sai hoặc giả mạo</option>
                  <option value="ConflictOfInterest">Xung đột lợi ích</option>
                  <option value="Other">Lý do khác</option>
                </select>
              </div>
              <div class="form-group" style="margin-top:12px;">
                <label class="form-label" for="reviewReportDetails">Mô tả thêm</label>
                <textarea id="reviewReportDetails" class="form-input" maxlength="500" style="height:100px;resize:vertical" placeholder="Nêu ngắn gọn nội dung vi phạm..."></textarea>
              </div>
              <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:18px;">
                <button type="button" class="btn btn--outline" id="cancelReviewReport">Hủy</button>
                <button type="button" class="btn btn--primary" id="submitReviewReport">Gửi báo cáo</button>
              </div>
            </div>`;
          document.body.appendChild(overlay);
          const close = () => overlay.remove();
          overlay.addEventListener('click', (event) => { if (event.target === overlay) close(); });
          document.getElementById('cancelReviewReport').addEventListener('click', close);
          document.getElementById('submitReviewReport').addEventListener('click', async (event) => {
              const button = event.currentTarget;
              button.disabled = true;
              const oldText = button.textContent;
              button.textContent = 'Đang gửi...';
              try {
                  await api.post(`/restaurants/${slug}/reviews/${reviewId}/report`, {
                      reason: document.getElementById('reviewReportReason').value,
                      details: document.getElementById('reviewReportDetails').value.trim(),
                  });
                  toast.success('Đã gửi báo cáo cho bộ phận quản trị.');
                  close();
              } catch (error) {
                  toast.error(error.message);
                  button.disabled = false;
                  button.textContent = oldText;
              }
          });
      }

      function shareRestaurant() {
          const url = window.location.href;
          if (navigator.share) {
              navigator.share({
                  title: document.title,
                  url: url
              }).catch(console.error);
          } else {
              navigator.clipboard.writeText(url).then(() => {
                  toast.success('Đã sao chép liên kết vào clipboard');
              });
          }
      }

      function initRestaurantMap(restaurant) {
        if (!restaurant.Latitude || !restaurant.Longitude) {
          document.getElementById('restaurant-map').innerHTML =
            '<p class="empty-state-small">Chưa có dữ liệu vị trí cho quán này.</p>';
          return;
        }
        const map = L.map('restaurant-map').setView(
          [restaurant.Latitude, restaurant.Longitude], 16
        );
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap contributors',
        }).addTo(map);
        L.marker([restaurant.Latitude, restaurant.Longitude])
          .addTo(map)
          .bindPopup(`<strong>${restaurant.Name}</strong><br>${restaurant.Address}`)
          .openPopup();
      }

      let getRatingValue = null;

      async function loadReviews(slug, page) {
        try {
            const res = await api.get(`/restaurants/${slug}/reviews?page=${page}&limit=10`);
            const { data, total, page: rPage, totalPages } = res.data;
            
            // Assume we still have access to restaurant rating via another fetch or we can pass it, but wait: we only have reviews here.
            // Let's re-fetch the restaurant quickly just for the latest rating, or just keep what we had.
            // Actuallly we can just use total from here.
            
            const rRes = await api.get(`/restaurants/${slug}`);
            document.getElementById('rating-summary').innerHTML = starRating.renderStatic(rRes.data.Rating || 0, total);
            
            reviewList.renderList(document.getElementById('review-list'), data);
            document.querySelectorAll('[data-review-report]').forEach((button) => {
              button.addEventListener('click', () => openReviewReportDialog(slug, button.dataset.reviewReport));
            });

            const formWrap = document.getElementById('review-form-wrap');
            if (auth.isLoggedIn()) {
               formWrap.innerHTML = `
                 <div style="margin-bottom: var(--space-4); padding: var(--space-4); border: 1px solid var(--color-border); border-radius: var(--radius-md);">
                    <h4 style="margin-bottom:8px;">Viết đánh giá của bạn</h4>
                    <div id="star-input-container" style="margin-bottom:12px;"></div>
                    <textarea id="review-comment" class="form-input" style="width:100%; height:80px; margin-bottom:4px;" placeholder="Chia sẻ trải nghiệm thực tế của bạn..."></textarea>
                    <p class="review-policy-note">Đánh giá có từ ngữ xúc phạm, tục tĩu, spam hoặc nội dung không liên quan sẽ bị từ chối. Đánh giá tiêu cực nhưng trung thực vẫn được tôn trọng.</p>
                    <div style="display:flex; gap:8px;">
                      <button class="btn btn--primary" id="btnSubmitReview">Gửi đánh giá</button>
                      <button class="btn btn--outline" id="btnDeleteReview" style="display:none;">Xóa đánh giá</button>
                    </div>
                 </div>
               `;
               getRatingValue = starRating.renderInput('star-input-container', 0);
               
               // Check if user already reviewed
               const user = auth.getUser();
               const existing = data.find(r => r.UserId === user.id); // This might only find if it's on this page, but fine for now
               if (existing) {
                  document.getElementById('btnDeleteReview').style.display = 'block';
                  document.getElementById('review-comment').value = existing.Comment || '';
                  getRatingValue = starRating.renderInput('star-input-container', existing.Rating);
               }

               document.getElementById('btnSubmitReview').addEventListener('click', async (event) => {
                  const submitButton = event.currentTarget;
                  const rating = getRatingValue();
                  if (rating === 0) return toast.error('Vui lòng chọn số sao');
                  const comment = document.getElementById('review-comment').value;
                  submitButton.disabled = true;
                  const oldText = submitButton.textContent;
                  submitButton.textContent = 'Đang gửi đánh giá...';
                  try {
                      await api.post(`/restaurants/${slug}/reviews`, { rating, comment });
                      toast.success('Cảm ơn bạn đã đánh giá!');
                      await loadReviews(slug, 1);
                  } catch(err) {
                      toast.error(err.message);
                  } finally {
                      submitButton.disabled = false;
                      submitButton.textContent = oldText;
                  }
               });

               document.getElementById('btnDeleteReview').addEventListener('click', async () => {
                  try {
                      await api.delete(`/restaurants/${slug}/reviews`);
                      toast.success('Đã xóa đánh giá.');
                      loadReviews(slug, 1);
                  } catch(err) {
                      toast.error(err.message);
                  }
               });

            } else {
               formWrap.innerHTML = `<p style="margin-bottom: var(--space-4);"><a href="/pages/login.html?redirect=${encodeURIComponent(location.pathname + location.search)}" style="color:var(--color-primary); font-weight:600;">Đăng nhập để viết đánh giá</a></p>`;
            }

            const pageWrap = document.getElementById('review-pagination');
            if (totalPages > 1) {
                pageWrap.style.display = 'flex';
                document.getElementById('revPageInfo').textContent = `Trang ${rPage} / ${totalPages}`;
                const prev = document.getElementById('revPrevPage');
                const next = document.getElementById('revNextPage');
                
                prev.disabled = rPage === 1;
                next.disabled = rPage === totalPages;
                
                prev.onclick = () => loadReviews(slug, rPage - 1);
                next.onclick = () => loadReviews(slug, rPage + 1);
            } else {
                pageWrap.style.display = 'none';
            }
        } catch(e) {
            console.error('Error loading reviews:', e);
        }
      }
    </script>
</body>
</html>
